name: Ingestion pesante (Playwright)

# Per le fonti che bloccano un fetch semplice (rilevamento bot, es.
# fibs.it) — usa un browser reale invece di una richiesta HTTP diretta.
# Gira meno spesso del job leggero perché più costoso in tempo/risorse.

on:
  schedule:
    - cron: "*/30 * * * *" # ogni 30 minuti
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # non deve mai restare bloccato indefinitamente
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser (Chromium)
        env:
          DEBIAN_FRONTEND: noninteractive # evita che apt-get resti in attesa di una conferma interattiva
        run: npx playwright install --with-deps chromium

      - name: Esegui ingestione pesante
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ingest:heavy
