name: Ingestion pesante (placeholder)

# Riservato a fonti future che dovessero bloccare un fetch semplice
# (rilevamento bot) e richiedere un browser reale. Il baseball, che
# inizialmente usava questo workflow con Playwright per fibs.it, è
# stato spostato sul job leggero: la fonte usata ora
# (live.baseballfvg.it, sito proprio dell'utente) non ha protezioni
# anti-bot, quindi basta un fetch semplice.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Step di prova (nessuna fonte assegnata al momento)
        run: echo "Workflow pesante inattivo — nessuna fonte lo richiede attualmente."
